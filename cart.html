<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart — AltafMedia Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="site-header"></header>

<div class="page-hero">
  <div class="container">
    <span class="eyebrow">Your Selection</span>
    <h1 class="h-section" style="font-size:clamp(30px,4.5vw,44px)">Shopping Cart</h1>
  </div>
</div>

<section style="padding-top:24px">
  <div class="container">
    <div id="cartWrap"></div>
  </div>
</section>

<footer class="site-footer"></footer>

<script src="assets/js/config.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/app.js"></script>
<script>
boot("Shop");

function renderPage(){
  const items = Cart.items();
  const wrap = $("#cartWrap");
  if(!items.length){
    wrap.innerHTML = `<div class="empty-state">
      <div class="big">🛒</div><h3>Your cart is empty</h3>
      <p>Add your favorite templates from the shop.</p>
      <a href="shop.html" class="btn btn-primary" style="margin-top:18px">Browse Templates →</a>
    </div>`;
    return;
  }
  const sub = Cart.subtotal();
  wrap.innerHTML = `<div class="cart-layout">
    <div>
      ${items.map(i=>{
        const p = getProduct(i.id); if(!p) return "";
        return `<div class="cart-page-item">
          <a href="product.html?id=${p.id}"><img src="${p.previews[0]}" alt="${p.title}"></a>
          <div style="min-width:0">
            <a href="product.html?id=${p.id}" style="font-weight:700;font-size:16px">${p.title}</a>
            <div style="color:var(--muted);font-size:13.5px;margin-top:4px">${p.category} · ${fmt(p.price)} each</div>
            <div class="c-actions" style="margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px">
              <div class="mini-qty" style="border:1.5px solid var(--line)">
                <button onclick="Cart.setQty('${p.id}',${i.qty-1});renderPage()" style="width:36px;height:36px">−</button>
                <span style="min-width:36px">${i.qty}</span>
                <button onclick="Cart.setQty('${p.id}',${i.qty+1});renderPage()" style="width:36px;height:36px">+</button>
              </div>
              <button class="rm" onclick="Cart.remove('${p.id}');renderPage()">Remove</button>
            </div>
          </div>
          <div style="font-weight:800;font-size:18px;text-align:right">${fmt(p.price*i.qty)}</div>
        </div>`;
      }).join("")}
      <a href="shop.html" style="color:var(--brand);font-weight:700">← Continue shopping</a>
    </div>
    <div class="cart-summary">
      <h3 style="margin-bottom:16px">Order Summary</h3>
      <div class="sum-row"><span>Subtotal</span><span>${fmt(sub)}</span></div>
      <div class="sum-row"><span>Delivery</span><span style="color:var(--green);font-weight:700">WhatsApp — Free</span></div>
      <div class="sum-row total"><span>Total</span><span>${fmt(sub)}</span></div>
      <a href="checkout.html" class="btn btn-primary btn-block" style="margin-top:18px">Proceed to Checkout →</a>
      <button class="btn btn-outline btn-block" style="margin-top:10px" onclick="if(confirm('Clear the cart?')){Cart.clear();renderPage();}">Clear Cart</button>
    </div>
  </div>`;
}
renderPage();
</script>
</body>
</html>
